<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca de Jogos</title>
  <meta name="description" content="Catálogo pessoal de jogos exportado do Playnite.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://shared.akamai.steamstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Biblioteca<span>de jogos</span></h1>
      <dl class="stats" id="stats"></dl>
    </div>
    <div class="searchbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar jogo, desenvolvedor, editora…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Filtros">
      <div class="sidebar-head">
        <h2>Filtros</h2>
        <button class="link" id="clear" type="button">Limpar tudo</button>
        <button class="icon-btn only-mobile" id="close-filters" type="button" aria-label="Fechar filtros">✕</button>
      </div>
      <div id="facets"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="content">
      <div class="toolbar">
        <button class="btn only-mobile" id="open-filters" type="button">Filtros <span id="filter-count"></span></button>
        <div class="segmented" id="status" role="radiogroup" aria-label="Status">
          <button type="button" data-v="" role="radio">Todos</button>
          <button type="button" data-v="Jogado" role="radio">Jogados</button>
          <button type="button" data-v="Não jogado" role="radio">Não jogados</button>
        </div>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="sort">
          <label for="sort" class="sr">Ordenar por</label>
          <select id="sort">
            <option value="name">Nome</option>
            <option value="releaseDate">Lançamento</option>
            <option value="criticScore">Nota da crítica</option>
            <option value="communityScore">Nota da comunidade</option>
            <option value="added">Adicionado</option>
            <option value="playtime">Tempo de jogo</option>
            <option value="lastActivity">Última atividade</option>
          </select>
          <button class="icon-btn" id="dir" type="button" aria-label="Inverter ordem" title="Inverter ordem"></button>
        </div>
        <button class="btn accent" id="random" type="button" title="Sortear um jogo dentre os filtrados">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="15.5" cy="8.5" r="1.3"/><circle cx="8.5" cy="15.5" r="1.3"/></svg>
          Sortear
        </button>
      </div>
      <div class="active-filters" id="active"></div>
      <div class="grid" id="grid"></div>
      <div id="sentinel"></div>
      <p class="empty" id="empty" hidden>Nenhum jogo encontrado com esses filtros.</p>
      <footer class="foot" id="foot"></footer>
    </main>
  </div>

  <dialog id="detail" aria-labelledby="d-title">
    <div class="d-hero" id="d-hero"></div>
    <button class="icon-btn d-close" id="d-close" type="button" aria-label="Fechar">✕</button>
    <div class="d-body">
      <div class="d-cover" id="d-cover"></div>
      <div class="d-main">
        <p class="d-kicker" id="d-kicker"></p>
        <h2 id="d-title"></h2>
        <p class="d-credits" id="d-credits"></p>
        <div class="d-facts" id="d-facts"></div>
        <div class="chips" id="d-chips"></div>
        <section class="d-desc">
          <h3>Descrição</h3>
          <div id="d-desc" class="prose"></div>
        </section>
        <section class="d-links" id="d-links-wrap">
          <h3>Links</h3>
          <div id="d-links" class="links"></div>
        </section>
      </div>
    </div>
    <nav class="d-nav">
      <button class="btn" id="d-prev" type="button">← Anterior</button>
      <button class="btn" id="d-next" type="button">Próximo →</button>
    </nav>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
